services:
  postgres:
    image: postgres:15
    container_name: postgres_museo
    environment:
      POSTGRES_DB: mi_basedatos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - museo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mi_basedatos"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_museo
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - museo_network

volumes:
  postgres_data:

networks:
  museo_network:
    driver: bridge
